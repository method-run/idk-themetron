# Check each pull request, and each push to main: the docs tree, the tests on each Node version
# that package.json supports, and the site build. The repository is public, so these runs are
# free on GitHub's standard runners.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to a pull request stops the run for its older commit.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test on Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22', '24']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test

  docs-and-site:
    name: Docs and site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx idk-plans check --quiet
      - run: npm run build

  # In headless Chrome, themetron's looks on each framework's parts match plain looks, in each
  # state. It takes about 15 seconds after npm ci. The runner has Chrome. On a failure, the
  # contact sheet of the parts is an artifact of the run.
  looks:
    name: Looks on each framework
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run looks:check
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: looks-check
          path: test-results/looks-check
